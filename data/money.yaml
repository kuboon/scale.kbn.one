meta:
  id: money
  title: お金のスケール
  subtitle: 1円から日本の個人金融資産まで
  unit: 円
  unitSymbol: 円
  minExponent: 0
  maxExponent: 15.4

entries:
  # --- 1万円以下：豆知識 ---
  - exponent: 0
    value: 3
    name: 1円玉1枚をつくる費用
    nameEn: Cost to Mint a 1-Yen Coin
    description: 額面の1円より製造費のほうが高い

  - exponent: 1
    value: 2
    name: 1万円札1枚をつくる費用
    nameEn: Cost to Print a 10,000-Yen Note
    description: 1万円の価値が、約20円の紙に刷られている

  - exponent: 2
    value: 1.4
    name: 宝くじ1枚（300円）の期待値
    nameEn: Expected Value of a 300-Yen Lottery Ticket
    description: 売上のうち賞金に回るのは半分以下（還元率 約46%）

  - exponent: 2
    value: 2
    name: スマホを1年間毎日充電した電気代
    nameEn: A Year of Daily Phone Charging
    description: 1回あたり0.5円ほど

  - exponent: 2
    value: 2.5
    name: 給食1食の食材費
    nameEn: Ingredients for One School Lunch
    description: 公立小学校の給食費（保護者負担）の1食あたり

  - exponent: 2
    value: 6
    name: 国政選挙の費用（有権者1人あたり）
    nameEn: National Election Cost per Voter
    description: 1回約600億円を、約1億人の有権者で割ると

  - exponent: 3
    value: 2
    exact: true
    name: 2000円札
    nameEn: 2,000-Yen Note
    description: 2000年に発行。いまも有効だが、ほとんど流通していない

  - exponent: 3
    value: 3
    name: 自動販売機1台の月の電気代
    nameEn: Monthly Electricity for a Vending Machine
    description: 冷やす・温めるで、1台あたり月に数千円

  # --- 1万円〜1億円 ---
  - exponent: 4
    value: 1.6
    name: ごみ処理費（1人あたり年間）
    nameEn: Waste Disposal per Person per Year
    description: 家庭ごみの収集・処理に市町村が使うお金を、人口で割ると

  - exponent: 4
    value: 4.5
    name: 救急車の出動1回にかかる費用
    nameEn: Cost of One Ambulance Call-out
    description: 利用者の負担はゼロ。費用は市町村の消防費から

  - exponent: 5
    value: 3.8
    name: 医療費（国民1人あたり年間）
    nameEn: Medical Spending per Person per Year
    description: 窓口で払う分は、このうち一部

  - exponent: 6
    value: 1
    exact: true
    name: 札束ひとつ
    nameEn: A Bundle of Banknotes
    description: 1万円札100枚。重さ約100g、厚さ約1cm

  - exponent: 6
    value: 4.6
    name: 平均年収
    nameEn: Average Annual Salary
    description: 1年を通じて働いた給与所得者の平均

  - exponent: 6
    value: 9
    name: 普通国債の残高（国民1人あたり）
    nameEn: Government Bonds per Person
    description: 税金で返していく国の借金を、赤ちゃんも含めた人口で割ると

  - exponent: 7
    value: 3
    name: 高規格救急車1台
    nameEn: One Advanced Ambulance
    description: 車体に、救命処置のための資機材を積んだ価格

  - exponent: 7
    value: 5
    name: 消防ポンプ車1台
    nameEn: One Fire Pumper Truck
    description: 町の消防署にある、いちばん基本の消防車

  # --- 1億円〜1兆円 ---
  - exponent: 8
    value: 1
    exact: true
    name: 1億円の重さ
    nameEn: The Weight of 100 Million Yen
    description: 1万円札1枚が約1gなので、1億円で約10kg

  - exponent: 8
    value: 1.5
    name: はしご車1台
    nameEn: One Ladder Truck
    description: 高層ビルの火災に備える、いちばん高価な消防車

  - exponent: 8
    value: 3
    name: 生涯賃金
    nameEn: Lifetime Earnings
    description: 大卒で定年まで働いた場合（退職金を除く）

  - exponent: 9
    value: 1
    exact: true
    name: 年末ジャンボ 1等＋前後賞
    nameEn: Year-End Jumbo Lottery Top Prize
    description: 1等7億円と前後賞1.5億円×2

  - exponent: 9
    value: 3
    name: 小さな村の年間予算
    nameEn: Annual Budget of a Small Village
    description: 人口数千人規模の村の一般会計

  - exponent: 10
    value: 4.5
    name: 人口10万人の市の年間予算
    nameEn: Annual Budget of a City of 100,000
    description: 一般会計。ごみ、学校、福祉、消防・救急などをまかなう

  - exponent: 10
    value: 6
    name: 国政選挙1回の費用
    nameEn: Cost of a National Election
    description: 投票所の運営、開票、ポスター掲示場など

  - exponent: 10
    value: 6.5
    name: 東京スカイツリーの総事業費
    nameEn: Tokyo Skytree
    description: 周辺の商業施設などを含めた総額

  - exponent: 11
    value: 1
    name: 大谷翔平の契約（10年総額）
    nameEn: Shohei Ohtani's Contract
    description: 2023年、ドジャースと7億ドルで契約

  - exponent: 11
    value: 2.7
    name: 東京消防庁の年間予算
    nameEn: Tokyo Fire Department Annual Budget
    description: 世界最大級の消防組織。救急も担う

  - exponent: 11
    value: 3.5
    name: 鳥取県の年間予算
    nameEn: Tottori Prefecture Annual Budget
    description: 人口が最も少ない県の一般会計

  # --- 1兆円〜100兆円 ---
  - exponent: 12
    value: 1.4
    name: 東京2020オリンピックの総経費
    nameEn: Tokyo 2020 Olympics
    description: 大会組織委員会・東京都・国の負担の合計

  - exponent: 12
    value: 2
    name: 横浜市の年間予算
    nameEn: Yokohama City Annual Budget
    description: 市町村で最大級の一般会計

  - exponent: 12
    value: 2.1
    name: 全国の消防費（年間）
    nameEn: Japan's Fire and Ambulance Services
    description: 全国の市町村が消防・救急に使う年間の総額

  - exponent: 12
    value: 3.7
    name: 生活保護費（年間）
    nameEn: Public Assistance
    description: 国と自治体の負担を合わせた事業費

  - exponent: 12
    value: 7
    name: リニア中央新幹線（品川〜名古屋）
    nameEn: Chuo Shinkansen Maglev
    description: 総工費の見込み

  - exponent: 12
    value: 9
    name: 東京都の年間予算
    nameEn: Tokyo Metropolitan Annual Budget
    description: 一般会計。鳥取県の約26倍、スウェーデンの国家予算並み

  - exponent: 12
    value: 8.7
    name: 防衛費（年間）
    nameEn: Defense Budget
    description: 2025年度

  - exponent: 13
    value: 1.4
    name: 介護保険の給付（年間）
    nameEn: Long-Term Care Insurance Benefits
    description: 介護サービスにかかる費用のうち保険から出る分

  - exponent: 13
    value: 3.8
    name: 国の社会保障関係費（年間）
    nameEn: Social Security in the National Budget
    description: 国の一般会計から、年金・医療・介護などに回す分

  - exponent: 13
    value: 4.7
    name: 国民医療費（年間）
    nameEn: National Medical Expenditure
    description: 病気やけがの治療に、1年間で使われた医療費の総額

  - exponent: 13
    value: 6
    name: 公的年金の給付（年間）
    nameEn: Public Pension Benefits
    description: 国民年金・厚生年金として1年間に支払われる総額

  - exponent: 13
    value: 7.5
    name: 国の税収（年間）
    nameEn: National Tax Revenue
    description: 所得税・消費税・法人税など

  - exponent: 13
    value: 9.7
    name: 全国の自治体の予算（合計）
    nameEn: Local Government Budgets, Total
    description: 地方財政計画の規模。都道府県と市町村の予算をまとめたもの

  # --- 100兆円〜 ---
  - exponent: 14
    value: 1.15
    name: 国の一般会計予算（年間）
    nameEn: National General Account Budget
    description: 歳出の約3分の1が社会保障

  - exponent: 14
    value: 1.4
    name: 社会保障給付費（年間）
    nameEn: Total Social Security Benefits
    description: 年金・医療・介護・福祉などに1年間で使われる総額

  - exponent: 14
    value: 6
    name: 日本のGDP
    nameEn: Japan's GDP
    description: 国内で1年間に生み出された付加価値の合計（名目）

  - exponent: 15
    value: 1.1
    name: 普通国債の残高
    nameEn: Outstanding Government Bonds
    description: 税金で返していく国の借金。GDPの約2倍

  - exponent: 15
    value: 2.2
    name: 個人の金融資産
    nameEn: Household Financial Assets
    description: 家計が持つ現金・預金・株式・保険・年金などの合計。約半分は現金・預金
